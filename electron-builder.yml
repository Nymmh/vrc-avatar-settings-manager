appId: com.nymh.avatarsettingsmanager
productName: VRC Avatar Settings Manager
directories:
  buildResources: build
copyright: Copyright © 2025 ${author}
files:
  # Production dependencies and package.json are included by electron-builder.
  - 'out/main/**/*'
  - 'out/preload/**/*'
  - 'out/renderer/**/*'
  - 'resources/icon.png'
  - '!**/*.{heapsnapshot,heapprofile,map}'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
  - '!**/node_modules/*.d.ts'
  - '!**/node_modules/.bin'
asarUnpack:
  - '**/node_modules/better-sqlite3/build/**/*'
electronLanguages:
  - en-US
win:
  executableName: VRC Avatar Settings Manager
  target: nsis
nsis:
  artifactName: ${productName} ${version} setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: false
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  license: README/terms.txt
  installerSidebar: build/sidebar.bmp
  uninstallerSidebar: build/sidebar.bmp
  installerLanguages:
    - en-US
  deleteAppDataOnUninstall: true
  include: build/installer.nsh
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Nymh
  category: Utility
appImage:
  artifactName: ${productName} ${version}.${ext}
npmRebuild: false
asar: true
compression: maximum
removePackageScripts: true
nodeGypRebuild: false
buildDependenciesFromSource: false
publish:
  - provider: generic
    url: https://nymmh.github.io/vrc-avatar-settings-manager/updates/app/
    useMultipleRangeRequest: false
  - provider: github
    owner: Nymmh
    repo: vrc-avatar-settings-manager
    tagNamePrefix: app-v
    releaseType: draft
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
